# This workflow is only for fork repositories to release from dev branch.
# It's a simplified version that doesn't require upstream secrets.
name: Fork Release

on:
  push:
    # Supports: v1.2.3, dev-xxx, xxx-dev (deb requires version starting with digit)
    tags: ["v*.*.*", "dev-*", "*-dev"]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (leave empty to use current branch HEAD)'
        required: false
        type: string
      snapshot:
        description: 'Build snapshot (no tag required, no GitHub release created)'
        required: false
        type: boolean
        default: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Delete huge unnecessary tools folder
        run: rm -rf /opt/hostedtoolcache

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Snapshot mode: build without tag, no GitHub release
      - name: Run GoReleaser (Snapshot)
        if: ${{ github.event.inputs.snapshot == 'true' }}
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --snapshot --skip=announce --skip=homebrew --skip=nix --skip=docker --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload snapshot artifacts
        if: ${{ github.event.inputs.snapshot == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      # Release mode: requires tag, creates GitHub release
      - name: Run GoReleaser (Release)
        if: ${{ github.event.inputs.snapshot != 'true' }}
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          # Skip features that require upstream secrets or external repos:
          # - validate: skip validation for fork releases
          # - announce: skip telegram announcement
          # - homebrew: skip homebrew tap (requires upstream repo access)
          # - nix: skip NUR (requires upstream repo access)
          # - docker: skip docker push (images are hardcoded to upstream registry)
          args: release --skip=validate --skip=announce --skip=homebrew --skip=nix --skip=docker --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
